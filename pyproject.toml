[project]
name = "email-sender"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.0",
    "fastapi>=0.115,<1.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "python-dotenv>=1.2.4",
    "resend>=2.49.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
