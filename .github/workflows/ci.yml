name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check the formatting with ruff
        run: uv run ruff format --check .

      - name: Run the tests
        run: uv run pytest
